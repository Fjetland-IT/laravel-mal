# Lokalt utviklingsmiljø i Docker. Brukes bare når .utvikling er «docker»; start med ./dev, ikke
# docker compose direkte (./dev setter prosjektnavn og bruker-ID). Se README, «Lokalt».
#
# Ligner vps1: PHP 8.5-FPM + nginx, MySQL 8.4, Valkey (9.0) på unix-socket med samme ACL-mønster som
# app-brukerne på vps1, Node 24 for Vite, og Mailpit i stedet for SMTP2GO.
#
# - Porter kommer fra .env (APP_PORT, VITE_PORT, MAILPIT_PORT) og publiseres bare på 127.0.0.1.
#   MySQL og Valkey publiseres ikke. Egne tillegg (f.eks. MySQL-port til TablePlus) legges i
#   compose.override.yaml, som er gitignorert.
# - Ingen prod-hemmeligheter: verdiene under er lokale og kommer fra den lokale .env.
# - Ikke en del av deploy: workflowen tar compose.yaml, docker/, dev og .utvikling ut av grenen deploy.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME mangler – bruk ./dev}

x-bruker: &bruker "${DEV_UID:-1000}:${DEV_GID:-1000}"

services:
    php:
        build:
            context: ./docker/php
        user: *bruker
        working_dir: /var/www/html
        environment:
            HOME: /tmp
            COMPOSER_CACHE_DIR: /composer-cache
        volumes:
            - .:/var/www/html
            - valkey-sock:/run/valkey
            - composer-cache:/composer-cache
        depends_on:
            mysql:
                condition: service_healthy
            valkey:
                condition: service_healthy
        init: true

    nginx:
        image: nginx:stable-alpine
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - "127.0.0.1:${APP_PORT:?APP_PORT mangler i .env – kjør ./dev oppsett}:80"
        depends_on:
            - php

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE mangler i .env}
            MYSQL_USER: ${DB_USERNAME:?DB_USERNAME mangler i .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mangler i .env}
            # Lokalt root-passord fra .env; ./dev bruker det til testdatabasen <DB_DATABASE>_test.
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD mangler i .env}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/lokal.cnf:/etc/mysql/conf.d/lokal.cnf:ro
        healthcheck:
            # mysqladmin ping gir 0 også ved «Access denied»; den feiler bare når serveren ikke svarer.
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
            interval: 3s
            timeout: 5s
            retries: 60
            start_period: 10s

    valkey:
        image: valkey/valkey:9.0
        entrypoint: ["sh", "/start.sh"]
        environment:
            REDIS_USERNAME: ${REDIS_USERNAME:?REDIS_USERNAME mangler i .env}
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD mangler i .env}
            REDIS_PREFIX: ${REDIS_PREFIX:?REDIS_PREFIX mangler i .env}
        volumes:
            - ./docker/valkey/start.sh:/start.sh:ro
            - valkey-sock:/run/valkey
            - valkey-data:/data
        healthcheck:
            test: ["CMD-SHELL", "test -S /run/valkey/valkey.sock"]
            interval: 2s
            timeout: 3s
            retries: 30

    vite:
        image: node:24
        user: *bruker
        working_dir: /var/www/html
        environment:
            HOME: /tmp
            npm_config_cache: /tmp/.npm
            npm_config_update_notifier: "false"
            # laravel-vite-plugin lytter da på 0.0.0.0 i containeren, bruker VITE_PORT fra .env og
            # skriver http://localhost:<VITE_PORT> i public/hot.
            LARAVEL_SAIL: "1"
        command: ["npm", "run", "dev"]
        volumes:
            - .:/var/www/html
        ports:
            - "127.0.0.1:${VITE_PORT:?VITE_PORT mangler i .env}:${VITE_PORT:?VITE_PORT mangler i .env}"
        init: true

    mailpit:
        image: axllent/mailpit:latest
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: "1"
            MP_SMTP_AUTH_ALLOW_INSECURE: "1"
            MP_MAX_MESSAGES: "1000"
        ports:
            - "127.0.0.1:${MAILPIT_PORT:?MAILPIT_PORT mangler i .env}:8025"

volumes:
    mysql-data:
    valkey-data:
    valkey-sock:
    composer-cache:
