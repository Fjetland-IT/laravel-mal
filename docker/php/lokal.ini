; Som /etc/php/8.5/fpm/conf.d/99-vps*.ini på vps1 (Fjetland-IT/vps, bootstrap.sh), bortsett fra
; revalidate_freq=0, så endret kode gjelder med en gang.
expose_php = Off
cgi.fix_pathinfo = 0

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
