name: Test, bygg og deploy

# main: test → bygg orphan-grenen `deploy` (prod-vendor + public/build) → SSH til vps1,
# der app-brukerens authorized_keys bare tillater pull-deploy.sh.
# PR-er (f.eks. Dependabot): bare test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Alt er bare-les, unntatt jobben som pusher deploy-grenen.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:
  test:
    name: Test og audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci og audit
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Bygg frontend
        run: npm run build

      - name: Tester
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test

  bygg:
    name: Bygg deploy-grenen
    needs: test
    # Ikke i selve malen (Fjetland-IT/laravel-mal), bare i repoer laget fra den.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && !github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pusher deploy-grenen med GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - name: Prod-avhengigheter
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bygg frontend
        run: |
          npm ci
          npm run build

      - name: Commit og push deploy-grenen
        run: |
          # Det som ikke skal til serveren
          rm -rf node_modules tests .github scripts _ignore _to_delete "Claude outputs" \
                 CLAUDE.md.tpl phpunit.xml .phpunit.result.cache ./*.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fersk orphan-gren: deploy-historikken er alltid ett bygg = én commit.
          git checkout --orphan deploy
          git rm -rfq --cached .

          # Minimal .gitignore for deploy-grenen (vendor og public/build skal med).
          printf '/node_modules\n/.env\n' > .gitignore

          git add -A
          git commit -q -m "Deploy-bygg av ${GITHUB_SHA::7}"
          git push -f origin deploy

  deploy:
    name: Deploy til vps1
    needs: bygg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      HELSESJEKK_URL: ${{ vars.HELSESJEKK_URL }}
    steps:
      - name: Mangler deploy-secrets?
        if: env.DEPLOY_HOST == '' || env.DEPLOY_USER == ''
        run: echo "::notice::DEPLOY_HOST/DEPLOY_USER mangler – deploy-grenen er bygget, men ingenting er sendt til serveren."

      - name: Kjør pull-deploy.sh på serveren
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          # Nøkkelen har command="…/pull-deploy.sh",restrict på serveren; kommandoen her ignoreres.
          ssh -i "$dir/key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
              -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" deploy

      - name: Helsesjekk
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.HELSESJEKK_URL != ''
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HELSESJEKK_URL" || true)
            if [ "$code" = "200" ]; then echo "Helsesjekk OK ($HELSESJEKK_URL)"; exit 0; fi
            echo "Forsøk $i: HTTP $code"; sleep 10
          done
          echo "::error::$HELSESJEKK_URL svarte ikke 200"; exit 1
