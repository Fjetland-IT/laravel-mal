name: Test, bygg og deploy

# main: test → bygg orphan-grenen `deploy` (prod-vendor + public/build) → SSH til vps1,
# der app-brukerens authorized_keys bare tillater pull-deploy.sh, som sjekker /up mot 127.0.0.1 (O13).
# PR-er (f.eks. Dependabot): bare test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Alt er bare-les, unntatt jobben som pusher deploy-grenen.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5'
  NODE_VERSION: '24'

jobs:
  test:
    name: Test og audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit
        run: composer audit --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm ci og audit
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Bygg frontend
        run: npm run build

      - name: Tester
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test

  bygg:
    name: Bygg deploy-grenen
    needs: test
    # Ikke i selve malen (Fjetland-IT/laravel-mal), bare i repoer laget fra den.
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && !github.event.repository.is_template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pusher deploy-grenen med GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - name: Prod-avhengigheter
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Bygg frontend
        run: |
          npm ci
          npm run build

      - name: Commit og push deploy-grenen
        run: |
          # Det som ikke skal til serveren
          rm -rf node_modules tests .github scripts _ignore _to_delete "Claude outputs" \
                 CLAUDE.md.tpl phpunit.xml .phpunit.result.cache ./*.md \
                 compose.yaml compose.override.yaml docker dev .utvikling

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fersk orphan-gren: deploy-historikken er alltid ett bygg = én commit.
          git checkout --orphan deploy
          git rm -rfq --cached .

          # Minimal .gitignore for deploy-grenen (vendor og public/build skal med).
          printf '/node_modules\n/.env\n' > .gitignore

          git add -A
          git commit -q -m "Deploy-bygg av ${GITHUB_SHA::7}"
          git push -f origin deploy

  deploy:
    name: Deploy til vps1
    needs: bygg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      HELSESJEKK_URL: ${{ vars.HELSESJEKK_URL }}
    steps:
      - name: Mangler deploy-secrets?
        if: env.DEPLOY_HOST == '' || env.DEPLOY_USER == ''
        run: echo "::notice::DEPLOY_HOST/DEPLOY_USER mangler – deploy-grenen er bygget, men ingenting er sendt til serveren."

      - name: Kjør pull-deploy.sh og sjekk /up lokalt
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key" "$dir/known_hosts"
          # Nøkkelen har command="/srv/<app>/pull-deploy.sh",restrict på vps1, så bare det skriptet kan startes.
          # Ordene etter vertsnavnet kommer fram som SSH_ORIGINAL_COMMAND: «--helsesjekk» får skriptet til å
          # sjekke /up mot nginx på 127.0.0.1 etter deployen, forbi Cloudflare (O13: Bot Fight Mode utfordrer
          # GitHub-runnere og kan ikke unntas på free-plan). Skriptets exit-kode styrer jobben.
          kjor() {
            ssh -i "$dir/key" \
                -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
                -o ConnectTimeout=20 \
                "$DEPLOY_USER@$DEPLOY_HOST" deploy --helsesjekk | tee "$dir/utskrift"
          }
          sjekket() { grep -Eq '^[0-9-]{10} [0-9:]{8} Helsesjekk lokalt OK: ' "$dir/utskrift"; }
          kjor
          # En pull-deploy.sh fra før O13 henter den nye versjonen, men fullfører med den gamle og sjekker
          # ikke /up. Da kjøres den nye én gang til (trygt å gjenta: fetch, migrate, optimize).
          if ! sjekket; then
            echo "::notice::pull-deploy.sh på serveren var eldre og sjekket ikke /up – kjører den nye versjonen."
            kjor
            sjekket || { echo "::error::pull-deploy.sh rapporterte ingen lokal helsesjekk"; exit 1; }
          fi

      - name: Offentlig sjekk via Cloudflare (bare varsel)
        if: env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.HELSESJEKK_URL != ''
        run: |
          # Avgjør ikke jobben: /up er alt sjekket lokalt på vps1. Med Bot Fight Mode (lite.beer, litepils.no)
          # får GitHub-runnere en managed challenge (403 med cf-mitigated: challenge); det er ventet.
          hode="$RUNNER_TEMP/helsesjekk-hode"
          code=$(curl -s -o /dev/null -D "$hode" -w '%{http_code}' --max-time 10 "$HELSESJEKK_URL" || true)
          if [ "$code" = "200" ]; then
            echo "Offentlig sjekk OK ($HELSESJEKK_URL)"
          elif grep -qi '^cf-mitigated: *challenge' "$hode" 2>/dev/null; then
            echo "Cloudflare utfordret runneren ($HELSESJEKK_URL, HTTP $code) – ventet med Bot Fight Mode."
          else
            echo "::warning::$HELSESJEKK_URL svarte HTTP $code via Cloudflare (lokalt på vps1 svarte /up 200)."
          fi
